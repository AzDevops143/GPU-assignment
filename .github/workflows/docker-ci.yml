name: Build, Test, Publish Docker Image & Export Artifacts

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NGC_REGISTRY: nvcr.io
  NGC_ORG: '1060059671547516'
  NGC_IMAGE_NAME: charantejgpu

jobs:
  build-test-and-package:
    name: Docker Build, CUDA Verify & Artifact Export (Points 1 to 5)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name for Docker
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${IMAGE_LOWER}" >> $GITHUB_ENV

      - name: Set up Python for Artifact Generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies for Artifacts
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib openpyxl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to NVIDIA NGC Registry
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        if: github.event_name != 'pull_request' && env.NGC_API_KEY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.NGC_REGISTRY }}
          username: '$oauthtoken'
          password: ${{ secrets.NGC_API_KEY }}

      - name: Build Docker image locally
        run: |
          echo "Building Docker container with CUDA 12.8, Nsight Systems and multi-GPU arch nvcc..."
          docker build -t gpu-assignment-local:latest .

      - name: Verify CUDA executable inside container
        run: |
          echo "Checking CUDA binary existence inside container..."
          docker run --rm gpu-assignment-local:latest ls -lh ./JOR ./heat_diffusion
          echo "Verifying NVIDIA Blackwell sm_100 CUBIN architecture via cuobjdump..."
          docker run --rm gpu-assignment-local:latest cuobjdump -lelf ./JOR

      # - name: Verify NVIDIA Nsight Systems CLI inside container
      #   run: |
      #     echo "Checking Nsight Systems CLI version..."
      #     docker run --rm gpu-assignment-local:latest nsys --version

      - name: Generate Complete Artifacts (Points 1 to 5)
        run: |
          echo "Generating Plots, Excel, CSVs, Binaries, and Profiling Artifacts..."
          python generate_artifacts.py

          CONTAINER_ID=$(docker create gpu-assignment-local:latest)
          docker cp $CONTAINER_ID:/workspace/JOR ./artifacts/4_bin_docs_source/JOR
          docker cp $CONTAINER_ID:/workspace/heat_diffusion ./artifacts/4_bin_docs_source/heat_diffusion_linux_x86_64
          docker rm $CONTAINER_ID
          chmod +x ./artifacts/4_bin_docs_source/JOR ./artifacts/4_bin_docs_source/heat_diffusion_linux_x86_64

          echo "Checking for NVIDIA GPU device for live Nsight profiling..."
          if command -v nvidia-smi &> /dev/null && nvidia-smi; then
            echo "NVIDIA GPU detected. Executing nsys profile..."
            docker run --gpus all --rm \
              -v $(pwd)/artifacts/5_profiling:/reports \
              gpu-assignment-local:latest \
              nsys profile -t cuda,osrt,nvtx --stats=true -o /reports/JOR_profile ./JOR 256 1e-4 2000000
            
            docker run --rm \
              -v $(pwd)/artifacts/5_profiling:/reports \
              gpu-assignment-local:latest \
              nsys stats --report cuda_gpu_kern_sum,cuda_api_sum /reports/JOR_profile.nsys-rep > ./artifacts/5_profiling/profile_summary.txt
          else
            echo "Standard runner without physical GPU detected. Baseline profiling analysis report packaged."
          fi

          echo "Listing all generated pipeline artifacts:"
          ls -R ./artifacts

      - name: Upload All Pipeline Artifacts for Download (Points 1 to 5)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-assignment-complete-artifacts
          path: ./artifacts/
          retention-days: 30

      - name: Push Docker image to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Tagging and pushing image to ${IMAGE_TAG}..."
          docker tag gpu-assignment-local:latest $IMAGE_TAG
          docker push $IMAGE_TAG

      # - name: Push Docker image to NVIDIA NGC Registry
      #   env:
      #     NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
      #   if: github.event_name != 'pull_request' && env.NGC_API_KEY != ''
      #   run: |
      #     NGC_TAG="${{ env.NGC_REGISTRY }}/${{ env.NGC_ORG }}/${{ env.NGC_IMAGE_NAME }}:latest"
      #     echo "Tagging and pushing image to ${NGC_TAG}..."
      #     docker tag gpu-assignment-local:latest $NGC_TAG
      #     docker push $NGC_TAG
