name: Build, Test, Publish Docker Image & Export Artifacts

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-test-and-package:
    name: Docker Build, CUDA Verify & Artifact Export (Points 1 to 4)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name for Docker
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${IMAGE_LOWER}" >> $GITHUB_ENV

      - name: Set up Python for Artifact Generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies for Artifacts
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib openpyxl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image locally
        run: |
          echo "Building Docker container with CUDA 12.6 and multi-GPU arch nvcc..."
          docker build -t gpu-assignment-local:latest .

      - name: Verify CUDA executable inside container
        run: |
          echo "Checking CUDA binary existence inside container..."
          docker run --rm gpu-assignment-local:latest ls -lh ./heat_diffusion

      - name: Generate Complete Artifacts (Points 1 to 4)
        run: |
          echo "Generating Plots, Excel, CSVs, and Document Artifacts..."
          python generate_artifacts.py

          # Extract compiled CUDA binary from Docker container into Point 4
          CONTAINER_ID=$(docker create gpu-assignment-local:latest)
          docker cp $CONTAINER_ID:/workspace/heat_diffusion ./artifacts/4_bin_docs_source/heat_diffusion_linux_x86_64
          docker rm $CONTAINER_ID
          chmod +x ./artifacts/4_bin_docs_source/heat_diffusion_linux_x86_64

          echo "Listing all generated pipeline artifacts:"
          ls -R ./artifacts

      - name: Upload All Pipeline Artifacts for Download (Points 1 to 4)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-assignment-complete-artifacts
          path: ./artifacts/
          retention-days: 30

      - name: Push Docker image to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Tagging and pushing image to ${IMAGE_TAG}..."
          docker tag gpu-assignment-local:latest $IMAGE_TAG
          docker push $IMAGE_TAG
