name: Build, Test, Publish Docker Image & Export Artifacts

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-test-and-package:
    name: Docker Build, CUDA Verify & Artifact Export
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name for Docker
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${IMAGE_LOWER}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image locally
        run: |
          echo "Building Docker container with CUDA 12.6 and multi-GPU arch nvcc..."
          docker build -t gpu-assignment-local:latest .

      - name: Verify CUDA executable inside container
        run: |
          echo "Checking CUDA binary existence inside container..."
          docker run --rm gpu-assignment-local:latest ls -lh ./heat_diffusion

      - name: Extract and collect pipeline artifacts
        run: |
          echo "Creating artifacts directory..."
          mkdir -p artifacts/bin
          mkdir -p artifacts/docs
          mkdir -p artifacts/source

          # 1. Extract compiled CUDA binary from the Docker container
          CONTAINER_ID=$(docker create gpu-assignment-local:latest)
          docker cp $CONTAINER_ID:/workspace/heat_diffusion ./artifacts/bin/heat_diffusion_linux_x86_64
          docker rm $CONTAINER_ID
          chmod +x ./artifacts/bin/heat_diffusion_linux_x86_64

          # 2. Copy source and scripts
          cp heat_diffusion.cu ./artifacts/source/
          cp Makefile ./artifacts/source/
          cp Dockerfile ./artifacts/source/
          cp docker-compose.yml ./artifacts/source/
          [ -f heat_diffusion_cuda.ipynb ] && cp heat_diffusion_cuda.ipynb ./artifacts/source/

          # 3. Copy documentation and PDF answers
          [ -f answers.pdf ] && cp answers.pdf ./artifacts/docs/
          [ -f GPU_Programming_Problems.pdf ] && cp GPU_Programming_Problems.pdf ./artifacts/docs/
          cp README.md ./artifacts/docs/

          # 4. Generate build metadata summary
          cat <<EOF > ./artifacts/BUILD_METADATA.txt
          ==========================================================
          GPU Assignment Pipeline Artifacts Build Summary
          ==========================================================
          Repository  : ${{ github.repository }}
          Image Name  : ${{ env.IMAGE_NAME }}
          Commit Hash : ${{ github.sha }}
          Branch      : ${{ github.ref_name }}
          Triggered By: ${{ github.actor }}
          Event       : ${{ github.event_name }}
          Date (UTC)  : $(date -u)
          CUDA Base   : nvidia/cuda:12.6.2-devel-ubuntu22.04
          Target GPUs : Hopper H100/H200 (sm_90), Ada RTX 4090/L4 (sm_89), Ampere A100 (sm_80/86), Turing T4 (sm_75), Blackwell-ready PTX (compute_90)
          Compiler    : nvcc -O3 -std=c++17 Multi-Architecture Fatbin
          ==========================================================
          Included Artifacts:
          - bin/heat_diffusion_linux_x86_64 (Compiled CUDA binary)
          - docs/answers.pdf (In-depth solution and learning guide)
          - docs/GPU_Programming_Problems.pdf (Assignment problem sheet)
          - source/ (Full source code, Dockerfile, Makefile, Compose)
          ==========================================================
          EOF

          echo "All pipeline artifacts collected successfully:"
          ls -R ./artifacts

      - name: Push Docker image to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Tagging and pushing image to ${IMAGE_TAG}..."
          docker tag gpu-assignment-local:latest $IMAGE_TAG
          docker push $IMAGE_TAG

      - name: Upload All Pipeline Artifacts for Download
        uses: actions/upload-artifact@v4
        with:
          name: gpu-assignment-all-artifacts
          path: ./artifacts/
          retention-days: 30
